[package]
name = "agentos"
version = "0.5.3"
description = "AgentOS desktop command center"
authors = ["AgentOS"]
edition = "2021"

[lib]
name = "agentos_lib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
tauri-plugin-dialog = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }
url = "2.5"
keyring = { version = "3.6", features = ["apple-native"] }
walkdir = "2.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync", "fs", "net"] }
sha1_smol = { version = "1", features = ["std"] }
sha2 = "0.10.9"
uuid = { version = "1.28.0", features = ["v4"] }
